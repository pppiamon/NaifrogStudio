name: naifrog-public
services:
  naifrog:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
    expose:
      - "8787"
    volumes:
      - naifrog-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      NAIFROG_DOMAIN: ${NAIFROG_DOMAIN:?请在 public.env 中填写实际服务域名}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      naifrog:
        condition: service_healthy
volumes:
  naifrog-data:
  caddy-data:
  caddy-config:
